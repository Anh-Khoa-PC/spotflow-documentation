servers:
  - url: http://dev-api.spotflow.one
    description: sandbox
  - url: https://api.spotflow.one
    description: prod
security:
  - bearerHttpAuthentication: []
paths:
  /api/v1/subscriptions/{subscription-id}/cancel:
    post:
      tags:
        - Subscription API
      operationId: cancelSubscription
      description: "Cancel a specific existing subscription payment"
      parameters:
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /api/v1/subscriptions/{subscription-id}/activate:
    post:
      tags:
        - Subscription API
      operationId: activateSubscription
      parameters:
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /api/v1/subscriptions/process:
    post:
      tags:
        - Subscription API
      operationId: processSubscriptions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/plans:
    get:
      tags:
        - Subscription API
      operationId: getPlans
      description: "This retrieves and lists all subscription plans available on your integration"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: internal-reference
          in: query
          required: false
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponsePlanDto'
    post:
      tags:
        - Subscription API
      operationId: createPlan
      description: "Create a subscription plan with Spotflow."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanDto'
  /api/v1/plans/{plan-id}:
    get:
      tags:
        - Subscription API
      operationId: getPlan
      description: "Reactivate a previously canceled single subscription plan."
      parameters:
        - name: plan-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanDto'
    post:
      tags:
        - Subscription API
      operationId: updatePlan
      description: "Update the details of an existing subscription plan"
      parameters:
        - name: plan-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanDto'
  /api/v1/plans/{plan-id}/cancel:
    post:
      tags:
        - Subscription API
      operationId: cancelPlan
      description: "Cancel a specific existing subscription plan."
      parameters:
        - name: plan-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanDto'
  /api/v1/plans/{plan-id}/activate:
    post:
      tags:
        - Subscription API
      operationId: activatePlan
      description: "Reactivate a previously canceled single subscription plan."
      parameters:
        - name: plan-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanDto'
  /api/v1/plans/bulk:
    post:
      tags:
        - Subscription API
      operationId: createPlansBulk
      description: "Create bulk subscription plans with Spotflow"
      requestBody:
        content:
          application/json:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreatePlanResponse'
  /api/v1/payments:
    get:
      tags:
        - Collections API
      operationId: getPayments
      description: "This retrieves and lists all payment collections available for a specific merchant"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            default: test
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponsePaymentDto'
    post:
      tags:
        - Collections API
      operationId: createPayment
      description: 'Our API helps you collect payments using different payment methods. Payment methods are available for each regions. This endpoint requires that your encrypt the JSON data before making the request. Check out our documentation here for more details on card encryption.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                  format: uuid
                request:
                  $ref: '#/components/schemas/CreatePaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentDto'
  /api/v1/payments/authorize:
    post:
      tags:
        - Collections API
      operationId: authorizePayment
      description: "This authorizes a payment by pre-approving the transaction before final validation. Authorization required could be PIN, OTP, 3DS, AVS, etc. For more details, check out our documentation."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                  format: uuid
                request:
                  $ref: '#/components/schemas/AuthorizePaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentDto'
  /api/v1/subscriptions/{subscription-id}:
    get:
      tags:
        - Subscription API
      operationId: getSubscription
      parameters:
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /api/v1/plans/{plan-id}/subscriptions:
    get:
      tags:
        - Subscription API
      operationId: getSubscriptions
      parameters:
        - name: plan-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseSubscriptionDto'
  /api/v1/plans/statistics:
    get:
      tags:
        - Subscription API
      operationId: getPlanStatistics
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanStatistics'
  /api/v1/payouts/{payout-id}:
    get:
      tags:
        - Settlement API
      operationId: getPayoutDetails
      parameters:
        - name: payout-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutRequestEntityDto'
  /api/v1/payments/{payment-id}:
    get:
      tags:
        - Collections API
      operationId: getPayment
      description: "Get details of a specific payment by its ID"
      parameters:
        - name: payment-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentDto'
  /api/v1/payments/verify:
    get:
      tags:
        - Collections API
      operationId: verifyPayment
      description: "Confirm the status of a payment"
      parameters:
        - name: merchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentDto'
components:
  schemas:
    UpsertWebhookRequest:
      type: object
      properties:
        url:
          type: string
        code:
          type: string
        mode:
          type: string
        options:
          $ref: '#/components/schemas/WebhookOptionsDto'
    WebhookOptionsDto:
      type: object
      properties:
        paymentSuccess:
          type: boolean
        paymentFailure:
          type: boolean
        subscriptionPaymentSuccess:
          type: boolean
        subscriptionPaymentFailure:
          type: boolean
    WebhookDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        mode:
          type: string
    UpdateUserRequest:
      required:
        - firstName
        - lastName
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        twoFactorEnabled:
          type: boolean
        twoFactorAuthType:
          type: string
        userType:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateUserStatusRequest:
      required:
        - code
        - status
      type: object
      properties:
        status:
          type: string
          description: User status to update. Not case sensitive.
          enum:
            - active
            - inactive
            - deleted
        code:
          type: string
          description: Authenticator code
      description: Request body to update the user's status
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          format: int32
        additionalDetails:
          type: object
          additionalProperties:
            type: object
        requestMarker:
          type: string
    SettlementProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
        supportEmailAddress:
          type: string
        supportPhoneNumber:
          type: string
        walletAddress:
          type: string
        network:
          type: string
        currency:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
        routing:
          type: string
        iban:
          type: string
        address:
          type: string
        supportedRail:
          type: string
          enum:
            - FIAT
            - CRYPTO
        providerStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    ConfirmPayoutRequest:
      type: object
      properties:
        payoutReference:
          type: string
        twoFaMethod:
          type: string
          enum:
            - EMAIL
            - TOTP
        otpCode:
          type: string
    ConfirmPayoutResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        payoutReference:
          type: string
    UpdateContactRequest:
      type: object
      properties:
        generalEmail:
          type: string
        disputeEmail:
          type: string
        supportEmail:
          type: string
    ContactDto:
      type: object
      properties:
        generalEmail:
          type: string
        disputeEmail:
          type: string
        supportEmail:
          type: string
    UpdateCallbackRequest:
      required:
        - mode
      type: object
      properties:
        url:
          type: string
        mode:
          type: string
        code:
          type: string
    CallBackDto:
      type: object
      properties:
        url:
          type: string
        mode:
          type: string
    FeeEntityDto:
      type: object
      properties:
        feeName:
          type: string
        flatFee:
          type: number
        percentageRate:
          type: number
        feeCap:
          type: number
        currency:
          type: string
        description:
          type: string
        feeCategory:
          type: string
          enum:
            - SETTLEMENT
            - EXCHANGE
            - COLLECTION
        feeType:
          type: string
          enum:
            - FLAT
            - PERCENTAGE
        region:
          type: string
    UpdateBusinessRequest:
      type: object
      properties:
        verificationStatus:
          type: string
          enum:
            - PENDING
            - PENDING_UPDATE
            - VERIFIED
            - REJECTED
        rejectionReasons:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
    CreateBusinessResponse:
      required:
        - address
        - apartment
        - businessLogoUrl
        - city
        - country
        - email
        - merchant
        - phoneNumber
        - province
        - state
        - zipCode
      type: object
      properties:
        country:
          maxLength: 2
          minLength: 2
          type: string
        merchant:
          type: string
        apartment:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        province:
          type: string
        zipCode:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        businessFormationDate:
          type: string
          format: date
        businessLogoUrl:
          type: string
        businessId:
          type: string
        verificationStatus:
          type: string
          enum:
            - PENDING
            - PENDING_UPDATE
            - VERIFIED
            - REJECTED
        rejectionReasons:
          type: string
    ApprovePayoutRequest:
      type: object
      properties:
        payoutStatus:
          type: string
          enum:
            - SUBMITTED
            - PENDING
            - PROCESSED
            - AWAITING_OTP
            - OTP_VALIDATED
            - AWAITING_DISBURSEMENT
            - DISBURSED
            - CANCELLED
            - SCREENING_REQ
            - VALIDATED
            - FAILED
            - RECONCILED
